[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-helper"
version = "0.7.0"
description = "Local Discord voice assistant powered by Whisper and Ollama"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jose Salazar" }
]

dependencies = [
  "discord.py[voice]>=2.7.0",
  "faster-whisper>=1.0.0",
  "ollama>=0.2.0",
  "python-dotenv>=1.0.0",
  "transformers>=4.42.0",
  "torch>=2.2.0",
  "ffmpeg-python>=0.2.0",
  "typer>=0.12.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0"
]

[project.scripts]
discord-helper = "discord_helper.cli:app"
