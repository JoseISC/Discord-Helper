[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-helper"
version = "0.7.0"
description = "Local Discord voice assistant powered by Whisper and Ollama"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jose Salazar" }
]

dependencies = [
  "discord.py[voice]>=2.7.0",
  "discord-ext-voice-recv @ git+https://github.com/vocolboy/discord-ext-voice-recv@main",
  "faster-whisper>=1.0.0",
  "ollama>=0.2.0",
  "python-dotenv>=1.0.0",
  "transformers>=4.42.0",
  "torch>=2.2.0",
  "numpy>=1.24",
  "ffmpeg-python>=0.2.0",
  "typer>=0.12.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
cuda    = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
windows = ["pywin32>=306", "colorama>=0.4.6"]
dev     = ["pytest>=7"]

[project.scripts]
discord-helper = "discord_helper.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["discord_helper*"]

[tool.setuptools.package-data]
"discord_helper" = ["gui/*.html", "gui/*.css", "gui/*.js", "gui/assets/*"]
